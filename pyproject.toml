[project]
name = "agentflow"
version = "0.1.0"
description = "Evidence-grounded research Agent with reliable orchestration and measurable retrieval."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
